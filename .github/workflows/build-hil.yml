#
# HIL CI: builds every board listed in hil/hil-boards.json, then flashes each
# one on the self-hosted HIL runner (label: wshil) and runs the hil/firmware
# pytest suite against it.
#
# The HIL_* credentials (see hil/firmware/conftest.py) are sourced from
# ~/.config/hil/creds.env on the HIL host, the same file ~/.bashrc loads for
# manual runs.
name: WipperSnapper HIL CI

on:
  workflow_dispatch:
  pull_request:

# One set of physical boards: queue runs instead of overlapping them.
concurrency:
  group: hil-wshil
  cancel-in-progress: false

jobs:
  hil-matrix:
    name: 📋HIL board matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.boards.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: hil
      - name: Read hil-boards.json
        id: boards
        working-directory: hil
        run: |
          python3 - <<'EOF'
          import json, os, sys
          from hil_board_utils import ESP_BOOTLOADER_OFFSETS

          data = json.load(open("hil-boards.json"))
          entries = data if isinstance(data, list) else [data]
          if not entries:
              sys.exit("hil-boards.json lists no boards")
          matrix = []
          for e in entries:
              chip = e.get("chip")
              if chip not in ESP_BOOTLOADER_OFFSETS:
                  sys.exit(f"board '{e.get('board')}': unknown chip {chip!r}")
              matrix.append({"board": e["board"], "chip": chip,
                             "offset": hex(ESP_BOOTLOADER_OFFSETS[chip])})
          print(json.dumps(matrix, indent=2))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps(matrix)}\n")
          EOF

  build:
    name: 🏗️${{ matrix.board }}
    needs: hil-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.hil-matrix.outputs.matrix) }}
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: actions/checkout@v7
      - name: Get WipperSnapper version
        run: |
          git fetch --prune --unshallow --tags
          git describe --dirty --tags --always
          echo >>$GITHUB_ENV WS_VERSION=$(git describe --dirty --tags --always)
      - uses: actions/checkout@v7
        with:
          repository: adafruit/ci-arduino
          ref: ci-wippersnapper
          path: ci
      - name: Checkout Board Definitions
        uses: actions/checkout@v7
        with:
          repository: adafruit/Wippersnapper_Boards
          path: ws-boards
      - name: Install CI-Arduino
        run: bash ci/actions_install.sh
      - name: Install extra Arduino libraries
        run: |
          git clone --quiet https://github.com/pstolarz/Arduino-Temperature-Control-Library.git /home/runner/Arduino/libraries/Arduino-Temperature-Control-Library
          git clone --quiet https://github.com/pstolarz/OneWireNg.git /home/runner/Arduino/libraries/OneWireNg
      - name: Download stable Nanopb
        id: download-nanopb
        continue-on-error: true
        run: |
          wget https://jpa.kapsi.fi/nanopb/download/nanopb-0.4.9.2.tar.gz
      - if: ${{ failure() || steps.download-nanopb.outcome != 'success' }}
        name: Restore cached nanopb
        id: cache-nanopb-restore
        uses: actions/cache/restore@v6
        with:
          path: ./nanopb-0.4.9.2.tar.gz
          key: nanopb-0.4.9.2.tar.gz
      - if: ${{ steps.download-nanopb.outcome == 'success' }}
        name: Save nanopb to cache
        id: cache-nanopb-save
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ./nanopb-0.4.9.2.tar.gz
          key: nanopb-0.4.9.2.tar.gz
      - name: Install stable Nanopb
        run: |
          tar -xf nanopb-0.4.9.2.tar.gz
          # Copy files to WipperSnapper's src/nanopb directory
          cp nanopb/pb_common.* nanopb/pb_encode.* nanopb/pb_decode.* src/nanopb
          mv nanopb/pb.h src/nanopb/nanopb.pb.h
      - name: Install Dependencies
        run: |
          pip install esptool==4.6
      - name: build ${{ matrix.board }}
        run: python3 ci/build_platform.py ${{ matrix.board }} --build_timeout 48000
      - name: Check artifacts
        run: |
          ls examples/Wippersnapper_demo/build/*
      - name: Rename build artifacts to reflect the platform name
        run: |
          mv examples/Wippersnapper_demo/build/*/Wippersnapper_demo.ino.bin wippersnapper.${{ matrix.board }}.littlefs.${{ env.WS_VERSION }}.bin
          mv examples/Wippersnapper_demo/build/*/Wippersnapper_demo.ino.bootloader.bin wippersnapper.${{ matrix.board }}.littlefs.${{ env.WS_VERSION }}.bootloader.bin
          mv examples/Wippersnapper_demo/build/*/Wippersnapper_demo.ino.partitions.bin wippersnapper.${{ matrix.board }}.littlefs.${{ env.WS_VERSION }}.partitions.bin
      - name: Check boot_app0 file existence (esp32 built from core, not-source)
        id: check_files
        uses: andstor/file-existence-action@v3
        with:
          files: "/home/runner/.arduino15/packages/esp32/hardware/esp32/*/tools/partitions/boot_app0.bin"
      - name: boot_app0 file from arduino-cli core
        if: steps.check_files.outputs.files_exists == 'true'
        run: mv /home/runner/.arduino15/packages/esp32/hardware/esp32/*/tools/partitions/boot_app0.bin wippersnapper.${{ matrix.board }}.littlefs.${{ env.WS_VERSION }}.boot_app0.bin
      - name: boot_app0 file from esp32 source bsp
        if: steps.check_files.outputs.files_exists == 'false'
        run: mv /home/runner/Arduino/hardware/espressif/esp32/tools/partitions/boot_app0.bin wippersnapper.${{ matrix.board }}.littlefs.${{ env.WS_VERSION }}.boot_app0.bin
      - name: Get Board Flash Parameters
        id: get_board_json
        run: |
          board_name=${{ matrix.board }}
          # Remove '_noota' suffix if present
          board_name=${board_name%_noota}
          # Remove 'wippersnapper_' prefix if present
          board_name=${board_name#wippersnapper_}
          content=$(cat ws-boards/boards/${board_name//_/-}/definition.json)
          {
            echo 'boardJson<<EOF'
            echo $content
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Create combined binary using Esptool merge_bin
        run: |
          python3 -m esptool --chip ${{fromJson(steps.get_board_json.outputs.boardJson).esptool.chip}} merge_bin \
            --flash_mode ${{fromJson(steps.get_board_json.outputs.boardJson).esptool.flashMode}} \
            --flash_freq ${{fromJson(steps.get_board_json.outputs.boardJson).esptool.flashFreq}} \
            --flash_size ${{fromJson(steps.get_board_json.outputs.boardJson).esptool.flashSize}} \
            -o wippersnapper.${{ matrix.board }}.littlefs.${{ env.WS_VERSION }}.combined.bin \
            ${{ matrix.offset }} wippersnapper.${{ matrix.board }}.littlefs.${{ env.WS_VERSION }}.bootloader.bin \
            0x8000 wippersnapper.${{ matrix.board }}.littlefs.${{ env.WS_VERSION }}.partitions.bin \
            0xe000 wippersnapper.${{ matrix.board }}.littlefs.${{ env.WS_VERSION }}.boot_app0.bin \
            0x10000 wippersnapper.${{ matrix.board }}.littlefs.${{ env.WS_VERSION }}.bin
      - name: Upload HIL firmware
        uses: actions/upload-artifact@v7
        with:
          name: hil-firmware-${{ matrix.board }}
          retention-days: 7
          if-no-files-found: error
          path: |
            wippersnapper.${{ matrix.board }}.littlefs.${{ env.WS_VERSION }}.combined.bin
            wippersnapper.${{ matrix.board }}.littlefs.${{ env.WS_VERSION }}.partitions.bin

  hil-test:
    name: 🧪HIL ${{ matrix.board }}
    needs: [hil-matrix, build]
    # Only the brentru fork has the wshil runner, and fork PRs must not run
    # their code on it.
    if: >-
      github.repository == 'brentru/Adafruit_Wippersnapper_Arduino' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, wshil]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.hil-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      # runner.temp persists on a self-hosted runner; conftest wants exactly
      # one combined.bin and one partitions.bin in the firmware dir.
      - name: Clean firmware and log dirs
        run: |
          FIRMWARE_DIR="$RUNNER_TEMP/firmware/${{ matrix.board }}"
          LOG_DIR="$RUNNER_TEMP/hil-logs/${{ matrix.board }}"
          rm -rf "$FIRMWARE_DIR" "$LOG_DIR"
          mkdir -p "$FIRMWARE_DIR" "$LOG_DIR"
          echo "FIRMWARE_DIR=$FIRMWARE_DIR" >> "$GITHUB_ENV"
          echo "LOG_DIR=$LOG_DIR" >> "$GITHUB_ENV"
      - name: Download HIL firmware
        uses: actions/download-artifact@v7
        with:
          name: hil-firmware-${{ matrix.board }}
          path: ${{ env.FIRMWARE_DIR }}
      - name: Set up HIL venv
        working-directory: hil
        run: |
          python3 -m venv venv
          venv/bin/pip install -q -r requirements.txt
      - name: Run HIL tests
        working-directory: hil
        run: |
          creds=~/.config/hil/creds.env
          if [ -f "$creds" ]; then
            set -a; . "$creds"; set +a
          else
            echo "::warning::$creds not found; tests that need credentials will fail"
          fi
          venv/bin/pytest firmware \
            --board "${{ matrix.board }}" \
            --firmware-dir "$FIRMWARE_DIR" \
            --serial-log-dir "$LOG_DIR" \
            --junitxml "$LOG_DIR/junit.xml" \
            --log-cli-level=INFO
      - name: Summarize HIL results
        if: always()
        run: |
          python3 - "$LOG_DIR/junit.xml" >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import sys
          import xml.etree.ElementTree as ET
          try:
              root = ET.parse(sys.argv[1]).getroot()
          except (OSError, ET.ParseError):
              print("### HIL ${{ matrix.board }}: no results (junit.xml missing)")
              sys.exit()
          suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
          n = {k: sum(int(s.get(k, 0)) for s in suites)
               for k in ("tests", "failures", "errors", "skipped")}
          print(f"### HIL ${{ matrix.board }}\n")
          print("| tests | failures | errors | skipped |\n|---|---|---|---|")
          print(f"| {n['tests']} | {n['failures']} | {n['errors']} | {n['skipped']} |")
          for s in suites:
              for case in s.iter("testcase"):
                  if case.find("failure") is not None or case.find("error") is not None:
                      print(f"- ❌ `{case.get('classname')}::{case.get('name')}`")
          EOF
      - name: Upload HIL logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hil-logs-${{ matrix.board }}
          path: ${{ env.LOG_DIR }}
          if-no-files-found: ignore
